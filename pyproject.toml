[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-price-drop-alerts"
version = "1.0.0"
description = "Price-drop and back-in-stock email alerts that run on GitHub Actions and send via Mailtrap."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "selectolax>=1.0,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "mailtrap>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pip-audit"]

[project.scripts]
price-alerts = "price_alerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modernise, S: bandit security checks
select = ["E", "F", "W", "I", "B", "UP", "S"]
# E501: long lines are left to the author. B905: zip() lengths are matched by construction in this code.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts are how pytest works; test tokens are dummy values
