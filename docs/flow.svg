<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="910" viewBox="0 0 1500 910" role="img" aria-labelledby="t d">
  <title id="t">Check to alert</title>
  <desc id="d">A GitHub Actions schedule runs python -m price_alerts. For each product it fetches the page, reads the price and stock, and applies the rules against the remembered state. When an alert fires once, it builds the email and sends it through the Mailtrap Transactional stream, and marks it sent only if Mailtrap accepts it. The result is one email in your inbox.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#232f3e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #232f3e; }
      .group { font-size: 22px; }
      .label { font-size: 18px; text-anchor: middle; }
      .start { text-anchor: start; }
      .sub { font-size: 15px; text-anchor: middle; fill: #545b64; }
      .sub.start { text-anchor: start; }
      .num { font-size: 20px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .flow { fill: none; stroke: #232f3e; stroke-width: 2.2; stroke-linejoin: round; marker-end: url(#arrow); }
      .glyph { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke: #232f3e; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1500" height="910" fill="#fff"/>

  <!-- ===== Groups ===== -->
  <rect x="230" y="30" width="830" height="820" fill="none" stroke="#232f3e" stroke-width="2.5"/>
  <rect x="230" y="30" width="56" height="56" fill="#232f3e"/>
  <g class="glyph" transform="translate(242 42)" stroke-width="2.4">
    <rect x="3" y="4" width="26" height="9" rx="2"/><rect x="3" y="18" width="26" height="9" rx="2"/>
    <path d="M8 8.5h.01M8 22.5h.01"/>
  </g>
  <text class="group" x="304" y="66">Your repo on GitHub Actions</text>

  <rect x="262" y="108" width="768" height="236" fill="none" stroke="#545b64" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="label start" x="282" y="138">Check each product</text>

  <rect x="262" y="572" width="768" height="248" fill="none" stroke="#545b64" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="label start" x="282" y="602">Alert</text>

  <rect x="1100" y="108" width="360" height="440" fill="none" stroke="#232f3e" stroke-width="2.5"/>
  <rect x="1100" y="108" width="56" height="56" fill="#232f3e"/>
  <path class="glyph" stroke-width="2.4" transform="translate(1110 120)" d="M9 26h20a7 7 0 0 0 .5-14A9.5 9.5 0 0 0 11 10a7.5 7.5 0 0 0-2 16z"/>
  <text class="group" x="1174" y="144">Mailtrap Email API</text>

  <rect x="1100" y="600" width="360" height="250" fill="none" stroke="#232f3e" stroke-width="2.5"/>
  <rect x="1100" y="600" width="56" height="56" fill="#232f3e"/>
  <g class="glyph" stroke-width="2.4" transform="translate(1112 612)">
    <rect x="2" y="6" width="28" height="20" rx="2.5"/><path d="M3 8l13 9 13-9"/>
  </g>
  <text class="group" x="1174" y="636">Your inbox</text>

  <g transform="translate(70 395)">
    <circle class="line" cx="45" cy="38" r="30"/>
    <path class="line" d="M45 20v19l12 8"/>
    <path class="line" d="M25 76h40"/>
  </g>
  <text class="label" x="115" y="505">Schedule</text>

  <g transform="translate(80 640)">
    <circle class="line" cx="35" cy="20" r="17"/>
    <path class="line" d="M4 82c0-20 14-32 31-32s31 12 31 32z"/>
  </g>
  <text class="label" x="115" y="755">You</text>

  <!-- ===== Nodes ===== -->
  <rect x="295" y="180" width="90" height="90" fill="#e7157b"/>
  <g class="glyph" transform="translate(295 180)"><circle cx="45" cy="45" r="21"/><ellipse cx="45" cy="45" rx="9" ry="21"/><path d="M24 45h42M27 33h36M27 57h36"/></g>
  <text class="label" x="340" y="296">Fetch the page</text>
  <text class="sub" x="340" y="318">robots.txt, delay, retry</text>
  <rect x="555" y="180" width="90" height="90" fill="#ed7100"/>
  <g class="glyph" transform="translate(555 180)"><path d="M22 66h46"/><path d="M26 56l12-14 10 8 16-20"/><path d="M56 30h8v8"/></g>
  <text class="label" x="600" y="296">Read the price</text>
  <text class="sub" x="600" y="318">JSON-LD, then selector</text>
  <rect x="835" y="180" width="90" height="90" fill="#dd344c"/>
  <g class="glyph" transform="translate(835 180)"><path d="M45 18l21 8v16c0 14-9 23-21 28-12-5-21-14-21-28V26z"/><path d="M35 45l7 7 13-14"/></g>
  <text class="label" x="880" y="296">Apply the rules</text>
  <text class="sub" x="880" y="318">price_below, back_in_stock</text>
  <rect x="555" y="408" width="90" height="90" fill="#c925d1"/>
  <g class="glyph" transform="translate(555 408)"><ellipse cx="45" cy="27" rx="20" ry="7"/><path d="M25 27v36c0 4 9 7 20 7s20-3 20-7V27"/><path d="M25 45c0 4 9 7 20 7s20-3 20-7"/></g>
  <text class="label" x="600" y="524">Remember</text>
  <text class="sub" x="600" y="546">state.json, history.csv</text>
  <rect x="295" y="645" width="90" height="90" fill="#8c4fff"/>
  <g class="glyph" transform="translate(295 645)"><path d="M45 22a14 14 0 0 0-14 14v10l-5 8h38l-5-8V36a14 14 0 0 0-14-14z"/><path d="M39 62a6 6 0 0 0 12 0"/></g>
  <text class="label" x="340" y="761">An alert fires</text>
  <text class="sub" x="340" y="783">once per event</text>
  <rect x="555" y="645" width="90" height="90" fill="#dd344c"/>
  <g class="glyph" transform="translate(555 645)"><path d="M29 18h22l12 12v42H29z"/><path d="M51 18v12h12M37 46h18M37 56h18"/></g>
  <text class="label" x="600" y="761">Build the email</text>
  <text class="sub" x="600" y="783">text and HTML, escaped</text>
  <rect x="835" y="645" width="90" height="90" fill="#01a88d"/>
  <g class="glyph" transform="translate(835 645)"><path d="M24 31h42M24 45h42M24 59h42"/><path d="M58 24l8 7-8 7"/></g>
  <text class="label" x="880" y="761">Send via Mailtrap</text>
  <text class="sub" x="880" y="783">marked sent if accepted</text>
  <rect x="1315" y="285" width="90" height="90" fill="#7aa116"/>
  <g class="glyph" transform="translate(1315 285)"><rect x="20" y="28" width="50" height="34" rx="3"/><path d="M21 31l24 17 24-17"/></g>
  <text class="label" x="1360" y="401">Transactional stream</text>
  <text class="sub" x="1360" y="423">price-alert, stock-alert</text>

  <g transform="translate(1315 690)">
    <path d="M10 46l9-24h52l9 24v20a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5z" fill="none" stroke="#ed7100" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M10 46h20l5 9h20l5-9h20" fill="none" stroke="#ed7100" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <text class="label" x="1360" y="791">One email per event</text>
  <text class="sub" x="1360" y="813">the deal is in the subject</text>
  <text class="sub" x="700" y="901">Opens the email</text>

  <!-- ===== Flows ===== -->
  <path class="flow" d="M160 432H202V225H291"/>
  <path class="flow" d="M389 225H551"/>
  <path class="flow" d="M649 225H831"/>
  <path class="flow" d="M860 330V453H649" marker-start="url(#arrow)"/>
  <path class="flow" d="M900 330V558H340V641"/>
  <path class="flow" d="M389 690H551"/>
  <path class="flow" d="M649 690H831"/>
  <path class="flow" d="M929 690H1080V355H1311"/>
  <path class="flow" d="M1360 436V686"/>
  <path class="flow" d="M1360 826V880H115V771" stroke-dasharray="7 6"/>

  <!-- ===== Step numbers ===== -->
  <g>
    <circle cx="160" cy="330" r="22" fill="#232f3e"/><text class="num" x="160" y="337">1</text>
    <circle cx="470" cy="187" r="22" fill="#232f3e"/><text class="num" x="470" y="194">2</text>
    <circle cx="720" cy="187" r="22" fill="#232f3e"/><text class="num" x="720" y="194">3</text>
    <circle cx="760" cy="420" r="22" fill="#232f3e"/><text class="num" x="760" y="427">4</text>
    <circle cx="940" cy="470" r="22" fill="#232f3e"/><text class="num" x="940" y="477">5</text>
    <circle cx="470" cy="652" r="22" fill="#232f3e"/><text class="num" x="470" y="659">6</text>
    <circle cx="720" cy="652" r="22" fill="#232f3e"/><text class="num" x="720" y="659">7</text>
    <circle cx="1000" cy="652" r="22" fill="#232f3e"/><text class="num" x="1000" y="659">8</text>
    <circle cx="1410" cy="574" r="22" fill="#232f3e"/><text class="num" x="1410" y="581">9</text>
  </g>
</svg>
