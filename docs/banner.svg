<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Price drop alerts for Python</title>
  <desc id="desc">A product card with its price, a falling price graph and a dashed target line, next to the project name.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#d9dee6"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#f2f4f7"/>
  <rect x="700" y="0" width="580" height="400" fill="url(#grid)" opacity="0.7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(80 104)">
      <rect width="48" height="48" rx="12" fill="#e8f0ea"/>
      <g transform="translate(12 12)" fill="none" stroke="#3a6b4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h6.2a2.5 2.5 0 0 1 1.8.7l6.3 6.3a2.5 2.5 0 0 1 0 3.5l-5.8 5.8a2.5 2.5 0 0 1-3.5 0L3.7 13.2A2.5 2.5 0 0 1 3 11.4z"/><circle cx="8" cy="8" r="1.2"/>
      </g>
    </g>
    <text x="80" y="214" font-size="44" font-weight="700" fill="#1a2230" letter-spacing="-0.8">Price drop alerts</text>
    <text x="80" y="266" font-size="44" font-weight="700" fill="#1a2230" letter-spacing="-0.8">for Python</text>
    <text x="80" y="314" font-size="20" fill="#5d6878">Email alerts when a price drops, sent with Mailtrap.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="60" width="420" height="280" rx="18" fill="#ffffff" stroke="#e1e5eb"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(806 92)">
      <rect width="40" height="40" rx="10" fill="#e8f0ea"/>
      <g transform="translate(8 8)" fill="none" stroke="#3a6b4d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h6.2a2.5 2.5 0 0 1 1.8.7l6.3 6.3a2.5 2.5 0 0 1 0 3.5l-5.8 5.8a2.5 2.5 0 0 1-3.5 0L3.7 13.2A2.5 2.5 0 0 1 3 11.4z"/><circle cx="8" cy="8" r="1.2"/>
      </g>
    </g>
    <rect x="1018" y="100" width="140" height="26" rx="13" fill="#e4f3e9"/>
    <circle cx="1035" cy="113" r="3.5" fill="#1d5a37"/>
    <text x="1102" y="117.5" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1d5a37">Target reached</text>
    <text x="806" y="156" font-size="12.5" fill="#6f7b85" letter-spacing="1.2">WIRELESS HEADPHONES</text>
    <text x="806" y="196" font-size="38" font-weight="700" fill="#1a2230" letter-spacing="-0.6">$139.00</text>
    <rect x="980" y="176" width="86" height="24" rx="7" fill="#e4f3e9"/>
    <text x="1023" y="192.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2f7d4f">↓ 15.8%</text>
    <path d="M806 296H1158" stroke="#2563a8" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="810" y="289" font-size="11.5" font-weight="600" fill="#2563a8">Target $150.00</text>
    <path d="M806 236 H846 V246 H892 V226 H940 V258 H986 V240 H1034 V272 H1086 V310 H1158" fill="none" stroke="#3a6b4d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1158" cy="310" r="5.5" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="2"/>
    <circle cx="1086" cy="310" r="4" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="2"/>
  </g>
</svg>
